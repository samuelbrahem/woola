# Netlify build + hosting for the Woola Next.js site (site "woolaservices", auto-deploys from GitHub main).
# Next.js is served by the Netlify Next Runtime (route handlers, ISR for Google reviews).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The division domains fold into woola.ca. Specific old pages first, then everything
# else to the division page. next.config.js carries the same map as a fallback.

[[redirects]]
  from = "https://woolamech.ca/about-woola"
  to = "https://woola.ca/about"
  status = 301
  force = true

[[redirects]]
  from = "https://woolamech.ca/careers"
  to = "https://woola.ca/careers"
  status = 301
  force = true

