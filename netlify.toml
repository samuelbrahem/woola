# Netlify build + hosting for the Woola Next.js site (site "woolaservices", auto-deploys from GitHub main).
# Next.js is served by the Netlify Next Runtime; hostname routing for the division
# domains is in middleware.ts (woolamech.ca shows /mechanical with its own domain).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# www.<division>.ca -> <division>.ca (Netlify only does this automatically for the primary domain).

[[redirects]]
  from = "https://www.woolamech.ca/*"
  to = "https://woolamech.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.woolapower.ca/*"
  to = "https://woolapower.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.woolabuild.ca/*"
  to = "https://woolabuild.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.woolaelectrical.ca/*"
  to = "https://woolaelectrical.ca/:splat"
  status = 301
  force = true

